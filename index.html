<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Projects</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #26344d,
                    #0b0f17 70%
                );

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .portfolio {

            width: 92%;

            max-width: 1100px;

            text-align: center;

        }


        .heading {

            margin-bottom: 25px;

        }


        .heading h1 {

            font-size: 48px;

            margin: 0;

        }


        .heading p {

            color: #9ca3af;

            margin-top: 8px;

            font-size: 17px;

        }


        .slideshow {

            position: relative;

            background: rgba(255, 255, 255, 0.07);

            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 24px;

            padding: 30px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.35);

        }


        .preview {

            height: 430px;

            border-radius: 18px;

            overflow: hidden;

            background: #111827;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .preview img {

            width: 100%;

            height: 100%;

            object-fit: contain;

            border-radius: 18px;

            transition: opacity 0.3s ease;

        }


        .no-image {

            font-size: 45px;

            font-weight: bold;

            color: #6b7280;

        }


        .info {

            padding: 25px 10px 10px;

        }


        .info h2 {

            font-size: 36px;

            margin: 0 0 10px;

        }


        .info p {

            color: #cbd5e1;

            font-size: 18px;

            line-height: 1.6;

            max-width: 700px;

            margin: auto;

        }


        .buttons {

            margin-top: 22px;

        }


        .button {

            display: inline-block;

            padding: 12px 22px;

            margin: 5px;

            border-radius: 10px;

            text-decoration: none;

            font-weight: bold;

            transition: transform 0.15s;

        }


        .button:hover {

            transform: translateY(-2px);

        }


        .github {

            background: white;

            color: #111827;

        }


        .demo {

            background: #2563eb;

            color: white;

        }


        .arrow {

            position: absolute;

            top: 210px;

            width: 50px;

            height: 50px;

            border: none;

            border-radius: 50%;

            background: rgba(0, 0, 0, 0.65);

            color: white;

            font-size: 28px;

            cursor: pointer;

            z-index: 5;

            transition: 0.15s;

        }


        .arrow:hover {

            background: rgba(0, 0, 0, 0.9);

            transform: scale(1.08);

        }


        .left {

            left: 45px;

        }


        .right {

            right: 45px;

        }


        .dots {

            margin-top: 20px;

        }


        .dot {

            display: inline-block;

            width: 10px;

            height: 10px;

            margin: 5px;

            border-radius: 50%;

            background: #4b5563;

            cursor: pointer;

            transition: 0.2s;

        }


        .dot.active {

            background: white;

            transform: scale(1.3);

        }


        .counter {

            color: #6b7280;

            margin-top: 12px;

            font-size: 14px;

        }


        .hint {

            color: #6b7280;

            margin-top: 20px;

            font-size: 14px;

        }


        @media (max-width: 700px) {

            .heading h1 {

                font-size: 36px;

            }


            .preview {

                height: 300px;

            }


            .arrow {

                top: 140px;

            }


            .left {

                left: 20px;

            }


            .right {

                right: 20px;

            }

        }

    </style>

</head>


<body>


<div class="portfolio">


    <div class="heading">

        <h1>My Projects</h1>

        <p>A selection of things I've built</p>

    </div>



    <div class="slideshow">


        <!-- Previous button -->

        <button
            class="arrow left"
            onclick="previousProject()">

            ←

        </button>



        <!-- Next button -->

        <button
            class="arrow right"
            onclick="nextProject()">

            →

        </button>



        <!-- Project image -->

        <div class="preview">

            <img
                id="previewImage"
                src=""
                alt="Project preview">


            <div
                class="no-image"
                id="noImage">

                No image provided

            </div>

        </div>



        <!-- Project information -->

        <div class="info">


            <h2 id="projectTitle"></h2>


            <p id="description"></p>



            <div class="buttons">


                <!-- GitHub button -->

                <a
                    id="github"
                    class="button github"
                    target="_blank">

                    View on GitHub

                </a>



                <!-- Live demo button -->

                <a
                    id="demo"
                    class="button demo"
                    target="_blank">

                    Live Demo

                </a>


            </div>


        </div>


    </div>



    <!-- Navigation dots -->

    <div
        class="dots"
        id="dots">
    </div>



    <!-- Project counter -->

    <div
        class="counter"
        id="counter">
    </div>



    <div class="hint">

        Use ← and → to navigate

    </div>


</div>



<script>


/*
    ==========================================
    YOUR PROJECTS
    ==========================================
*/


const projects = [


    {
        title: "Hack Club Boba Drops",

        description:
            "A website project I built for the boba drops workshop with Hack Club. When they accepted my project, they provided me with a £5 grant to spend on boba.",

        image:
            "images/cars.png",

        github:
            "https://github.com/kwqfjh/CARS",

        demo:
            null
    },


    {
        title: "Macropad",

        description:
            "A custom macropad project built and designed by me for the Blueprint Hack Club YSWS with a PCB, firmware, CAD-designed case and OLED display. They provided me with the parts to build it myself, along with a grant to buy a soldering iron. ",

        image:
            "images/macropad.png",

        github:
            "https://github.com/kwqfjh/reuben-s-tuffpad",

        demo:
            null
    },


    {
        title: "Ruler",

        description:
            "A project I built around a digital ruler.",

        image:
            "images/ruler.png",

        github:
            "https://github.com/kwqfjh/ruler",

        demo:
            null
    },


    {
        title: "My 3D Website",

        description:
            "A 3D web project I built for Hack Club Polygon recently. I will be provided with a cinema grant when they accept my project.",

        image:
            "images/farm.png",

        github:
            "https://github.com/kwqfjh/reubensfarm",

        demo:
            null
    },


    {
        title: "Boba",

        description:
            "A web project with a live online demo built for Boba drops.",

        image:
            null,

        github:
            "https://github.com/heelas-uk/boba",

        demo:
            "https://heelas-uk.github.io/boba/"

    }


];



/*
    ==========================================
    SLIDESHOW
    ==========================================
*/


let current = 0;

let timer;



function displayProject() {


    const project =
        projects[current];



    /*
        Project title
    */

    document
        .getElementById("projectTitle")
        .textContent =
        project.title;



    /*
        Project description
    */

    document
        .getElementById("description")
        .textContent =
        project.description;



    /*
        GitHub link
    */

    document
        .getElementById("github")
        .href =
        project.github;



    /*
        Project image
    */

    const image =
        document.getElementById("previewImage");


    const noImage =
        document.getElementById("noImage");



    if (project.image) {


        image.src =
            project.image;


        image.style.display =
            "block";


        noImage.style.display =
            "none";


    } else {


        image.style.display =
            "none";


        noImage.style.display =
            "block";

    }



    /*
        Live demo button
    */

    const demo =
        document.getElementById("demo");



    if (project.demo) {


        demo.href =
            project.demo;


        demo.style.display =
            "inline-block";


    } else {


        demo.style.display =
            "none";

    }



    /*
        Counter
    */

    document
        .getElementById("counter")
        .textContent =
        `${current + 1} / ${projects.length}`;



    /*
        Navigation dots
    */

    createDots();

}



function createDots() {


    const dots =
        document.getElementById("dots");


    dots.innerHTML =
        "";



    projects.forEach(
        (project, index) => {


            const dot =
                document.createElement("span");


            dot.className =
                "dot";



            if (index === current) {

                dot.classList.add(
                    "active"
                );

            }



            dot.onclick =
                function() {


                    current =
                        index;


                    displayProject();


                    restartTimer();

                };



            dots.appendChild(dot);

        }

    );

}



/*
    ==========================================
    NEXT PROJECT
    ==========================================
*/


function nextProject() {


    current++;


    if (
        current >=
        projects.length
    ) {

        current = 0;

    }


    displayProject();


    restartTimer();

}



/*
    ==========================================
    PREVIOUS PROJECT
    ==========================================
*/


function previousProject() {


    current--;


    if (current < 0) {

        current =
            projects.length - 1;

    }


    displayProject();


    restartTimer();

}



/*
    ==========================================
    KEYBOARD CONTROLS
    ==========================================
*/


document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key ===
            "ArrowRight"
        ) {

            nextProject();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            previousProject();

        }

    }
);



/*
    ==========================================
    AUTOMATIC SLIDESHOW
    ==========================================
*/


function restartTimer() {


    clearInterval(timer);


    timer =
        setInterval(
            nextProject,
            8000
        );

}



/*
    ==========================================
    START
    ==========================================
*/


displayProject();


restartTimer();


</script>


</body>

</html>
