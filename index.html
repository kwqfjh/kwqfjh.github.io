<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Projects</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(circle at top, #26344d, #0b0f17 65%);

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .portfolio {
            width: 92%;
            max-width: 1100px;
            text-align: center;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            font-size: 48px;
            margin: 0;
        }

        .heading p {
            color: #9ca3af;
            margin-top: 8px;
        }

        .slideshow {
            position: relative;

            background: rgba(255, 255, 255, 0.07);

            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 24px;

            padding: 30px;

            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
        }

        .preview {
            height: 430px;

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #374151,
                    #111827
                );

            overflow: hidden;

            position: relative;
        }

        .preview::after {
            content: "";

            position: absolute;

            width: 400px;
            height: 400px;

            border-radius: 50%;

            background: rgba(255,255,255,0.04);

            filter: blur(5px);
        }

        .preview-title {
            font-size: 64px;
            font-weight: bold;

            z-index: 1;
        }

        .info {
            padding: 25px 10px 10px;
        }

        .info h2 {
            font-size: 36px;
            margin: 0 0 10px;
        }

        .info p {
            color: #cbd5e1;

            font-size: 18px;

            line-height: 1.6;

            max-width: 700px;

            margin: auto;
        }

        .buttons {
            margin-top: 22px;
        }

        .button {
            display: inline-block;

            padding: 12px 22px;

            margin: 5px;

            border-radius: 10px;

            text-decoration: none;

            font-weight: bold;

            transition: transform 0.15s;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .github {
            background: white;
            color: #111827;
        }

        .demo {
            background: #2563eb;
            color: white;
        }

        .arrow {
            position: absolute;

            top: 210px;

            width: 50px;
            height: 50px;

            border: none;

            border-radius: 50%;

            background: rgba(0,0,0,0.55);

            color: white;

            font-size: 28px;

            cursor: pointer;

            z-index: 5;

            transition: 0.15s;
        }

        .arrow:hover {
            background: rgba(0,0,0,0.8);
            transform: scale(1.08);
        }

        .left {
            left: 45px;
        }

        .right {
            right: 45px;
        }

        .dots {
            margin-top: 20px;
        }

        .dot {
            display: inline-block;

            width: 10px;
            height: 10px;

            margin: 5px;

            border-radius: 50%;

            background: #4b5563;

            cursor: pointer;

            transition: 0.2s;
        }

        .dot.active {
            background: white;
            transform: scale(1.3);
        }

        .counter {
            color: #6b7280;

            margin-top: 12px;

            font-size: 14px;
        }

        .hint {
            color: #6b7280;

            margin-top: 20px;

            font-size: 14px;
        }

        @media (max-width: 700px) {

            .heading h1 {
                font-size: 36px;
            }

            .preview {
                height: 300px;
            }

            .preview-title {
                font-size: 42px;
            }

            .arrow {
                top: 140px;
            }

            .left {
                left: 40px;
            }

            .right {
                right: 40px;
            }
        }
    </style>
</head>


<body>

<div class="portfolio">

    <div class="heading">
        <h1>My Projects</h1>
        <p>A selection of things I've built with Hack Club</p>
    </div>


    <div class="slideshow">

        <button class="arrow left" onclick="previousProject()">
            ←
        </button>

        <button class="arrow right" onclick="nextProject()">
            →
        </button>


        <div class="preview">
            <div class="preview-title" id="previewTitle"></div>
        </div>


        <div class="info">

            <h2 id="projectTitle"></h2>

            <p id="description"></p>


            <div class="buttons">

                <a
                    id="github"
                    class="button github"
                    target="_blank">
                    View on GitHub
                </a>


                <a
                    id="demo"
                    class="button demo"
                    target="_blank">
                    Live Demo
                </a>

            </div>

        </div>

    </div>


    <div class="dots" id="dots"></div>

    <div class="counter" id="counter"></div>

    <div class="hint">
        Use ← → to navigate
    </div>

</div>


<script>

const projects = [

    {
        title: "Boba Drops project",

        description:
            "A website project I built.",

        github:
            "https://github.com/kwqfjh/CARS",

        demo:
            null
    },


    {
        title: "Macropad designed and built by me and funded by Hack Club",

        description:
            "A custom macropad project with a PCB, firmware, CAD-designed case and OLED display.",

        github:
            "https://github.com/kwqfjh/reuben-s-tuffpad",

        demo:
            null
    },


    {
        title: "Ruler (Hack Club CAD Project)",

        description:
            "A ruler",

        github:
            "https://github.com/kwqfjh/ruler",

        demo:
            null
    },


    {
        title: "3D Website",

        description:
            "A low poly 3d farm I built",

        github:
            "https://github.com/kwqfjh/reubensfarm",

        demo:
            null
    },


    {
        title: "Live demo",

        description:
            "A Boba Drops web project with a live online demo.",

        github:
            "https://github.com/heelas-uk/boba",

        demo:
            "https://heelas-uk.github.io/boba/"
    }

];


let current = 0;

let timer;


function displayProject() {

    const project = projects[current];


    document.getElementById("previewTitle").textContent =
        project.title;


    document.getElementById("projectTitle").textContent =
        project.title;


    document.getElementById("description").textContent =
        project.description;


    document.getElementById("github").href =
        project.github;


    const demo =
        document.getElementById("demo");


    if (project.demo) {

        demo.href = project.demo;

        demo.style.display = "inline-block";

    } else {

        demo.style.display = "none";

    }


    document.getElementById("counter").textContent =
        `${current + 1} / ${projects.length}`;


    createDots();

}


function createDots() {

    const dots =
        document.getElementById("dots");

    dots.innerHTML = "";


    projects.forEach((project, index) => {

        const dot =
            document.createElement("span");

        dot.className = "dot";


        if (index === current) {
            dot.classList.add("active");
        }


        dot.onclick = function() {

            current = index;

            displayProject();

            restartTimer();

        };


        dots.appendChild(dot);

    });

}


function nextProject() {

    current++;

    if (current >= projects.length) {
        current = 0;
    }

    displayProject();

    restartTimer();

}


function previousProject() {

    current--;

    if (current < 0) {
        current = projects.length - 1;
    }

    displayProject();

    restartTimer();

}


document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowRight") {
            nextProject();
        }

        if (event.key === "ArrowLeft") {
            previousProject();
        }

    }
);


function restartTimer() {

    clearInterval(timer);

    timer = setInterval(
        nextProject,
        8000
    );

}


displayProject();

restartTimer();

</script>

</body>
</html>
